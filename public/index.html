<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <meta name="description" content="Stream Zambian movies and series. Pay with MTN, Airtel or Zamtel mobile money.">
  <title>ZedStream</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <a href="#/" class="brand" aria-label="Home">
      <img src="/img/logo.svg" alt="" width="38" height="38">
      <span class="brand-name" id="brandName">ZED<b>STREAM</b></span>
    </a>
    <form class="search" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.42 1.4-5.39-5.38A8 8 0 1 1 10 2m0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12"/></svg>
      <input id="searchInput" type="search" placeholder="Search movies, series, genres..." autocomplete="off">
    </form>
    <select id="sortSelect" class="sort" aria-label="Sort movies">
      <option value="latest">Latest</option>
      <option value="popular">Most watched</option>
      <option value="rating">Top rated</option>
      <option value="az">A – Z</option>
      <option value="oldest">Oldest</option>
    </select>
    <nav class="nav" id="nav"></nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-pay">
      <span>Pay with</span>
      <span class="op mtn">MTN MoMo</span>
      <span class="op airtel">Airtel Money</span>
      <span class="op zamtel">Zamtel Kwacha</span>
    </div>
    <div class="footer-links">
      <a href="#/page/terms">Terms &amp; Conditions</a>
      <a href="#/page/privacy">Privacy Policy</a>
      <a href="#/page/copyright">Copyright</a>
    </div>
    <p class="muted" id="copyright"></p>
  </footer>

  <nav class="tabbar" id="tabbar" aria-label="Mobile navigation"></nav>

  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
